name: Build Obemi Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Find generated files
        run: |
          echo "=== ROOT DIRECTORY ==="
          ls -la
          echo ""
          echo "=== GENERATED DIRECTORIES ==="
          find . -maxdepth 5 -type d \
            -not -path './node_modules*' \
            -not -path './.git*' \
            | sort
          echo ""
          echo "=== GENERATED FILES ==="
          find . -maxdepth 5 -type f \
            -not -path './node_modules*' \
            -not -path './.git*' \
            | sort | head -200
