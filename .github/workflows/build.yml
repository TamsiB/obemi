name: Build Obemi Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Show build files
        run: |
          echo "Build folders:"
          find . -maxdepth 3 -type d \( -name "dist" -o -name ".output" \) -print
          echo "Output files:"
          find .output -maxdepth 3 -type f 2>/dev/null | head -50

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: obemi-build
          path: .output/
          if-no-files-found: error
